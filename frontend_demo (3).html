    rec:JSON.parse(JSON.stringify(SEED.rec)),tables:[2,2,4,4,6,8].map((cap,i)=>({id:i+1,cap,st:"FREE"})),
    orders:[],lines:[],bills:[],log:[],n:{i:SEED.items.length+1,g:SEED.ing.length+1,o:1,l:1,b:1}};
  history(c);return c}
function history(c){ // a few past bills so the dashboard and reports look real
  const combos=[[[1,2],[5,1],[12,2],[17,3]],[[9,1],[15,3],[20,2]],[[13,2],[19,2],[22,2]],[[3,1],[10,1],[16,4],[21,1]],
    [[14,1],[15,2],[18,2],[23,1]],[[6,2],[9,1],[15,4],[24,2]],[[12,1],[11,1],[16,2],[17,2]],[[7,1],[13,1],[19,1],[25,1]],
    [[2,2],[10,1],[15,2],[20,2]],[[8,1],[14,1],[15,2],[21,2]],[[4,1],[11,1],[12,1],[17,2]],[[1,1],[13,2],[19,2],[22,1]]];
  const offs=[0,0,0,1,1,2,2,3,4,4,5,6],M=["UPI","CASH","CARD"],now=Date.now();
  combos.forEach((cb,k)=>{const oid=c.n.o++,t=now-offs[k]*864e5-(k%4+1)*36e5,take=k%4===3;
    c.orders.push({id:oid,type:take?"TAKEAWAY":"DINE_IN",table:take?null:(k%6)+1,st:"BILLED",t});
    let sub=0;cb.forEach(([id,q])=>{const it=c.items.find(x=>x.id===id);c.lines.push({id:c.n.l++,oid,item:id,qty:q,price:it.price,notes:""});sub+=q*it.price});
    const disc=k%5===0?r2(sub*.1):0,tax=r2((sub-disc)*.05),total=r2(sub-disc+tax);
    c.bills.push({id:c.n.b++,oid,sub,disc,rate:5,tax,total,t,pays:k%6===2?[["CASH",r2(total/2)],["UPI",r2(total-r2(total/2))]]:[[M[k%3],total]]})})}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.n)S=fresh()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m,t){const e=$("toast");e.textContent=m;e.className=t==="err"?"err":"ok";e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3800)}
/* one "transaction": work on a copy, commit only if nothing throws */
function tx(fn,ok,then){const c=JSON.parse(JSON.stringify(S));
  try{const r=fn(c);S=c;save();if(then)then(r);if(ok)toast(ok);render();return r===undefined?true:r}
  catch(e){toast("Transaction rolled back: "+e.message,"err");render();return false}}
const item=(c,id)=>c.items.find(x=>x.id===id),ing=(c,id)=>c.ing.find(x=>x.id===id);
const ls=(c,oid)=>c.lines.filter(l=>l.oid===oid);
const sub=(c,oid)=>r2(ls(c,oid).reduce((a,l)=>a+l.qty*l.price,0));
function left(c,id){const r=c.rec[id]||[];if(!r.length)return 999;let m=1e9;r.forEach(([g,q])=>{m=Math.min(m,Math.floor(ing(c,g).qty/q+1e-9))});return m}
function consume(c,id,qty,why){(c.rec[id]||[]).forEach(([g,q])=>{const x=ing(c,g),need=r3(q*qty);
  if(need>0&&x.qty<need)throw Error("Not enough "+x.name+" in stock");x.qty=r3(x.qty-need);c.log.push({t:Date.now(),ing:x.name,chg:-need,why})})}
const lowCount=c=>c.ing.filter(g=>g.qty<=g.min).length;

function addCart(id){const l=CART.find(c=>c.id===id);if(l){if(l.qty>=maxQty(id)){toast("That is the most we can serve of this dish right now","err");return}l.qty++}else{if(maxQty(id)<1){toast("Sold out","err");return}CART.push({id,qty:1,note:""})}render()}

function addDish(){const n=$("mn").value.trim(),p=parseFloat($("mp").value);let id;
  tx(c=>{if(!n)throw Error("Dish name is required");if(!(p>0))throw Error("Price must be greater than 0");id=c.n.i++;
    c.items.push({id,cat:$("mc").value,name:n,desc:$("md").value.trim(),icon:$("mi").value.trim()||"🍽️",veg:$("mt").value==="1",price:p,av:true});c.rec[id]=[]},
    "Dish added. Now set its recipe so stock is deducted.",()=>{V.rid=id;V.p="recipe"})}
function addCat(){const n=$("mcat").value.trim();tx(c=>{if(!n)throw Error("Category name is required");if(c.cats.includes(n))throw Error("Category already exists");c.cats.push(n)},"Category added")}
function setPrice(id){const p=parseFloat($("pr"+id).value);tx(c=>{if(!(p>0))throw Error("Price must be greater than 0");item(c,id).price=p},"Price updated")}
function togItem(id){tx(c=>{const i=item(c,id);i.av=!i.av},"Availability changed")}
function delItem(id){if(!confirm("Delete this dish?"))return;tx(c=>{if(c.lines.some(l=>l.item===id))throw Error("Dish is used in past orders. Hide it instead.");c.items=c.items.filter(x=>x.id!==id);delete c.rec[id]},"Dish deleted")}

/* ---------- recipe ---------- */
function pRecipe(){const it=item(S,V.rid),rows=S.rec[it.id]||[];
  return `<a href="#" onclick="go('menu');return false">← Back to menu</a><h1>${esc(it.icon)} ${esc(it.name)} · Recipe</h1>
  <p class="sub">Ingredients used for <b>one portion</b>. Stock is deducted automatically from this recipe whenever the dish is ordered.</p>
  <div class="card tbl"><table><tr><th>Ingredient</th><th>Per portion</th><th></th></tr>${rows.map(([g,q])=>`<tr><td>${esc(ing(S,g).name)}</td><td>${q} ${ing(S,g).unit}</td><td><button class="d sm" onclick="rmRec(${it.id},${g})">Remove</button></td></tr>`).join("")||'<tr><td colspan="3">No ingredients yet. Add at least one so stock is tracked.</td></tr>'}</table></div>
  <div class="card"><h2>Add or update an ingredient</h2><div class="row"><select id="rg">${S.ing.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.unit})</option>`).join("")}</select><input id="rq" type="number" step="0.001" min="0.001" placeholder="Quantity per portion"><button onclick="saveRec(${it.id})">Save</button></div></div>`}
function saveRec(id){const g=+$("rg").value,q=parseFloat($("rq").value);tx(c=>{if(!(q>0))throw Error("Quantity must be positive");const r=c.rec[id]=c.rec[id]||[],x=r.find(y=>y[0]===g);if(x)x[1]=q;else r.push([g,q])},"Recipe saved")}
function rmRec(id,g){tx(c=>{c.rec[id]=(c.rec[id]||[]).filter(y=>y[0]!==g)},"Ingredient removed from recipe")}

/* ---------- Module 2: orders ---------- */
function pOrders(){const free=S.tables.filter(t=>t.st==="FREE");
  return `<h1>Order Management</h1><p class="sub">Module 2 · dine-in and takeaway orders</p>
  <div class="card"><h2>New order</h2><div class="row"><label><input type="radio" name="ot" value="DINE_IN" checked> Dine-in</label><label><input type="radio" name="ot" value="TAKEAWAY"> Takeaway</label>
  <select id="tsel">${free.map(t=>`<option value="${t.id}">Table ${t.id} (seats ${t.cap})</option>`).join("")||'<option value="">No free table</option>'}</select><button onclick="newOrder()">Start order</button></div></div>
  <div class="row"><input id="oq" placeholder="Search by order #, table, status..." style="min-width:260px"><select id="os"><option value="">All statuses</option><option>PLACED</option><option>BILLED</option><option>CANCELLED</option></select></div>
  <div class="card tbl"><table id="otb"><tr><th>#</th><th>Type</th><th>Table</th><th>Status</th><th>Amount</th><th></th></tr>${S.orders.slice().reverse().map(orderRow).join("")||'<tr><td colspan="6">No orders yet</td></tr>'}</table></div>`}
BIND.orders=()=>{const f=()=>{const q=$("oq").value.toLowerCase(),s=$("os").value;document.querySelectorAll("#otb tr[data-s]").forEach(r=>{const t=r.dataset.s;r.style.display=(t.includes(q)&&(!s||t.includes(s.toLowerCase())))?"":"none"})};
  $("oq").oninput=f;$("os").onchange=f;document.querySelectorAll("input[name=ot]").forEach(r=>r.onchange=()=>$("tsel").style.display=r.value==="TAKEAWAY"&&r.checked?"none":"")};
function newOrder(){const take=document.querySelector("input[name=ot]:checked").value==="TAKEAWAY",t=+$("tsel").value;
  tx(c=>{let tb=null;if(!take){tb=c.tables.find(x=>x.id===t);if(!tb||tb.st!=="FREE")throw Error("Table is already occupied");tb.st="OCCUPIED"}
    const id=c.n.o++;c.orders.push({id,type:take?"TAKEAWAY":"DINE_IN",table:take?null:t,st:"PLACED",t:Date.now()});return id},"Order created",id=>{V.oid=id;V.p="order"})}
const orderOf=id=>S.orders.find(o=>o.id===id);
function pOrder(){const o=orderOf(V.oid),open=o.st==="PLACED",lines=ls(S,o.id),total=sub(S,o.id);
  const menu=`<div class="card"><h2>Add items</h2><input id="note" placeholder="Note for the next item (e.g. less spicy, extra gravy)" style="width:100%;margin-bottom:8px">
    <div class="row"><input id="pq" placeholder="Search dishes..." style="flex:1;min-width:150px"><span class="chips" id="pv"><button class="chip on" data-v="">All</button><button class="chip" data-v="1">Veg</button><button class="chip" data-v="0">Non-Veg</button></span></div>
    <div class="chips" id="pc" style="margin-bottom:4px"><button class="chip on" data-c="">All</button>${S.cats.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="dgrid">${S.items.filter(i=>i.av).map(i=>{const n=left(S,i.id);return `<div class="dish ${n===0?"out":""}" data-n="${esc(i.name.toLowerCase())}" data-v="${i.veg?1:0}" data-c="${esc(i.cat)}"><span class="ic">${esc(i.icon)}</span>
      <span>${vt(i.veg)} <b>${esc(i.name)}</b></span><span class="pr">${money(i.price)}</span><small>${n===0?"Sold out":n<=5?n+" left":esc(i.cat)}</small><button class="sm" style="width:100%" ${n===0?"disabled":""} onclick="addLine(${o.id},${i.id})">+ Add</button></div>`}).join("")}</div></div>`;
  const panel=`<div class="card ${open?"sticky":""}"><h2>Order items</h2>${lines.map(l=>{const i=item(S,l.item);return `<div class="line"><span style="font-size:1.5rem">${esc(i.icon)}</span>
    <div class="nm">${vt(i.veg)} <b>${esc(i.name)}</b>${l.notes?`<div class="nt">${esc(l.notes)}</div>`:""}</div>
    ${open?`<div class="qty"><button class="s" onclick="chLine(${o.id},${l.id},'dec')">−</button><b>${l.qty}</b><button onclick="chLine(${o.id},${l.id},'inc')">+</button></div>`:`<b>× ${l.qty}</b>`}
    <b style="min-width:76px;text-align:right">${money(l.qty*l.price)}</b>${open?`<button class="d sm" title="Remove" onclick="chLine(${o.id},${l.id},'rm')">✕</button>`:""}</div>`}).join("")||'<p class="sub">No items yet. Pick dishes from the menu.</p>'}
    <div class="sum t"><span>Subtotal</span><span>${money(total)}</span></div>
    ${open&&lines.length?`<div style="margin-top:12px"><div class="row"><select id="dtype"><option value="AMOUNT">Discount ₹</option><option value="PERCENT">Discount %</option></select><input id="dval" type="number" step="0.01" min="0" placeholder="0" style="width:100px">
    <select id="trate"><option value="0">GST 0%</option><option value="5" selected>GST 5%</option><option value="12">GST 12%</option><option value="18">GST 18%</option></select></div>
    <div class="row"><select id="m1">${["CASH","CARD","UPI"].map(m=>`<option ${o.pay===m?"selected":""}>${m}</option>`).join("")}</select><label><input type="checkbox" id="split"> Split payment</label></div>
    <div class="row" id="sp" style="display:none"><input id="a1" type="number" step="0.01" min="0" placeholder="Amount for first method" style="flex:1"><select id="m2"><option value="">Second method</option><option>CASH</option><option>CARD</option><option>UPI</option></select></div>
    <div id="prev" style="margin:8px 0"></div><button style="width:100%" onclick="makeBill(${o.id})">Generate bill and pay</button></div>`:""}
    ${open?`<div style="margin-top:8px"><button class="d sm" onclick="cancelOrder(${o.id})">Cancel order</button></div>`:""}
    ${o.st==="BILLED"?`<button style="margin-top:10px" onclick="openOrder(${o.id})">View bill</button>`:""}</div>`;
  return `<a href="#" onclick="go('orders');return false">← All orders</a><h1>Order #${o.id} ${stTag(o.st)}</h1><p class="sub">${o.type==="DINE_IN"?"Dine-in · Table "+o.table:"Takeaway"}${o.source==="ONLINE"?` · Placed by customer${o.name?" ("+esc(o.name)+")":""} · chose <b>${o.pay}</b>, not paid yet`:""}</p>
  <div class="${open?"pos":""}">${open?menu:""}${panel}</div>`}
BIND.order=()=>{const o=orderOf(V.oid);if(o.st!=="PLACED")return;let vf="",cf="";const total=sub(S,o.id);
  const f=()=>{const q=$("pq").value.toLowerCase();document.querySelectorAll(".dgrid .dish").forEach(e=>e.style.display=(e.dataset.n.includes(q)&&(!vf||e.dataset.v===vf)&&(!cf||e.dataset.c===cf))?"":"none")};
  $("pq").oninput=f;document.querySelectorAll("#pv .chip").forEach(b=>b.onclick=()=>{vf=b.dataset.v;document.querySelectorAll("#pv .chip").forEach(x=>x.classList.toggle("on",x===b));f()});
  document.querySelectorAll("#pc .chip").forEach(b=>b.onclick=()=>{cf=b.dataset.c;document.querySelectorAll("#pc .chip").forEach(x=>x.classList.toggle("on",x===b));f()});
  if(!$("dval"))return;const calc=()=>{const dv=parseFloat($("dval").value)||0,t=$("dtype").value,r=+$("trate").value;let d=t==="PERCENT"?r2(total*dv/100):dv;d=Math.min(Math.max(d,0),total);const tax=r2((total-d)*r/100);
    $("prev").innerHTML=`<div class="sum"><span>Discount</span><span>-${money(d)}</span></div><div class="sum"><span>GST (${r}%)</span><span>${money(tax)}</span></div><div class="sum t"><span>Total</span><span>${money(total-d+tax)}</span></div>`};
  ["dval","dtype","trate"].forEach(i=>$(i).oninput=calc);calc();
  $("split").onchange=function(){$("sp").style.display=this.checked?"flex":"none";if(!this.checked){$("m2").value="";$("a1").value=""}}};
function addLine(oid,id){const notes=($("note").value||"").trim().slice(0,100);
  tx(c=>{const o=c.orders.find(x=>x.id===oid);if(o.st!=="PLACED")throw Error("Order is closed");const it=item(c,id);if(!it.av)throw Error("Item is not available");
    consume(c,id,1,"Order #"+oid);const x=c.lines.find(l=>l.oid===oid&&l.item===id&&l.notes===notes&&l.price===it.price);
    if(x)x.qty++;else c.lines.push({id:c.n.l++,oid,item:id,qty:1,price:it.price,notes})})}
function chLine(oid,lid,act){tx(c=>{const o=c.orders.find(x=>x.id===oid);if(o.st!=="PLACED")throw Error("Order is closed");const l=c.lines.find(x=>x.id===lid);if(!l)throw Error("Line not found");
  if(act==="inc"){consume(c,l.item,1,"Order #"+oid);l.qty++}
  else if(act==="dec"&&l.qty>1){consume(c,l.item,-1,"Reduced order #"+oid);l.qty--}
  else{consume(c,l.item,-l.qty,"Removed from order #"+oid);c.lines=c.lines.filter(x=>x.id!==lid)}})}
function cancelOrder(oid){if(!confirm("Cancel this order and return the stock?"))return;
  tx(c=>{const o=c.orders.find(x=>x.id===oid);if(o.st!=="PLACED")throw Error("Order is closed");ls(c,oid).forEach(l=>consume(c,l.item,-l.qty,"Cancelled #"+oid));
    o.st="CANCELLED";if(o.table)c.tables.find(t=>t.id===o.table).st="FREE"},"Order cancelled and stock restored",()=>{V.oid=null;V.p="orders"})}

/* ---------- Module 3: billing ---------- */
function makeBill(oid){const dt=$("dtype").value,dv=parseFloat($("dval").value||"0"),rate=+$("trate").value,m1=$("m1").value,sp=$("split").checked,m2=$("m2").value,a1=parseFloat($("a1").value);
  tx(c=>{const o=c.orders.find(x=>x.id===oid);if(o.st!=="PLACED")throw Error("Order already billed or cancelled");const s=sub(c,oid);if(!s)throw Error("Order has no items");
    if(isNaN(dv)||dv<0)throw Error("Invalid discount");let disc;if(dt==="PERCENT"){if(dv>100)throw Error("Discount % must be between 0 and 100");disc=r2(s*dv/100)}else disc=dv;
    if(disc>s)throw Error("Invalid discount");const tax=r2((s-disc)*rate/100),total=r2(s-disc+tax);let pays;
    if(sp){if(!m2||m1===m2)throw Error("Choose two different payment methods");if(isNaN(a1)||a1<=0||a1>=total)throw Error("First amount must be more than 0 and less than the total");pays=[[m1,a1],[m2,r2(total-a1)]]}else pays=[[m1,total]];
    c.bills.push({id:c.n.b++,oid,sub:s,disc,rate,tax,total,t:Date.now(),pays});o.st="BILLED";if(o.table)c.tables.find(t=>t.id===o.table).st="FREE"},
    "Bill generated and payment recorded",()=>{V.oid=null;V.bid=oid;V.p="bill"})}
function pBill(){const b=S.bills.find(x=>x.oid===V.bid),o=orderOf(b.oid);
  return `<div class="noprint"><a href="#" onclick="go('orders');return false">← All orders</a></div><div class="bill"><h2>Spice Garden</h2><div class="c">Tax Invoice</div>
  <table><tr><td>Invoice</td><td style="text-align:right"><b>INV-${String(b.id).padStart(5,"0")}</b></td></tr><tr><td>Order</td><td style="text-align:right">#${o.id} · ${o.type==="DINE_IN"?"Table "+o.table:"Takeaway"}</td></tr><tr><td>Date</td><td style="text-align:right">${tshort(b.t)}</td></tr></table><hr>
  <table>${ls(S,b.oid).map(l=>`<tr><td>${esc(item(S,l.item).name)} × ${l.qty}${l.notes?`<br><small>${esc(l.notes)}</small>`:""}</td><td style="text-align:right">${money(l.qty*l.price)}</td></tr>`).join("")}</table><hr>
  <table><tr><td>Subtotal</td><td style="text-align:right">${money(b.sub)}</td></tr><tr><td>Discount</td><td style="text-align:right">-${money(b.disc)}</td></tr><tr><td>GST (${b.rate}%)</td><td style="text-align:right">${money(b.tax)}</td></tr>
  <tr class="tot"><td>Total</td><td style="text-align:right">${money(b.total)}</td></tr></table><hr>${b.pays.map(p=>`<div style="display:flex;justify-content:space-between"><span>Paid by ${p[0]}</span><span>${money(p[1])}</span></div>`).join("")}
  <div class="c" style="margin-top:14px">Thank you! Visit again.</div></div><p style="text-align:center" class="noprint"><button onclick="print()">Print bill</button> <button class="s" onclick="go('orders')">New order</button></p>`}

/* ---------- Module 4: inventory ---------- */
function pInv(){return `<h1>Inventory</h1><p class="sub">Module 4 · ingredient stock, restock and stock log</p><div class="two">
  <div class="card"><h2>Restock</h2><div class="row"><select id="ri">${S.ing.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.unit})</option>`).join("")}</select><input id="rq" type="number" step="0.001" min="0.001" placeholder="Quantity to add"><button onclick="restock()">Restock</button></div></div>
  <div class="card"><h2>Add a new ingredient</h2><div class="row"><input id="gn" placeholder="Name" style="width:130px"><input id="gu" placeholder="Unit (kg, l, pcs)" style="width:110px"><input id="gq" type="number" step="0.001" min="0" placeholder="Stock" style="width:90px"><input id="gr" type="number" step="0.001" min="0" placeholder="Reorder at" style="width:100px"><button class="s" onclick="addIng()">Add</button></div></div></div>
  <div class="card tbl"><table><tr><th>Ingredient</th><th>Stock</th><th>Level</th><th>Reorder at</th><th>Status</th></tr>${S.ing.map(g=>{const p=g.min?Math.min(g.qty/(g.min*4)*100,100):100,low=g.qty<=g.min;return `<tr><td>${esc(g.name)}</td><td>${g.qty} ${esc(g.unit)}</td>
  <td style="width:30%"><div class="barbox"><div class="bar" style="width:${p}%;background:${low?"var(--red)":"var(--green)"}"></div></div></td><td>${g.min}</td><td><span class="tag ${low?"bad":"ok"}">${low?"LOW":"OK"}</span></td></tr>`}).join("")}</table></div>
  <h2>Recent stock log</h2><div class="card tbl"><table><tr><th>Ingredient</th><th>Change</th><th>Reason</th><th>Time</th></tr>${S.log.slice(-15).reverse().map(l=>`<tr><td>${esc(l.ing)}</td><td>${l.chg}</td><td>${esc(l.why)}</td><td>${tshort(l.t)}</td></tr>`).join("")||'<tr><td colspan="4">No stock movement yet</td></tr>'}</table></div>`}
function restock(){const g=+$("ri").value,q=parseFloat($("rq").value);tx(c=>{if(!(q>0))throw Error("Quantity must be positive");const x=ing(c,g);x.qty=r3(x.qty+q);c.log.push({t:Date.now(),ing:x.name,chg:q,why:"Restock"})},"Stock updated")}
function addIng(){const n=$("gn").value.trim(),u=$("gu").value.trim(),q=parseFloat($("gq").value||"0"),r=parseFloat($("gr").value||"0");
  tx(c=>{if(!n||!u)throw Error("Name and unit are required");if(c.ing.some(x=>x.name.toLowerCase()===n.toLowerCase()))throw Error("Ingredient already exists");if(q<0||r<0)throw Error("Quantities cannot be negative");c.ing.push({id:c.n.g++,name:n,unit:u,qty:q,min:r})},"Ingredient added")}

/* ---------- Module 5: reports ---------- */
function repData(){const byDay={},byItem={},byCat={},pay={},kind={};
  S.bills.forEach(b=>{const k=dkey(b.t);byDay[k]=byDay[k]||{n:0,v:0};byDay[k].n++;byDay[k].v+=b.total;const o=orderOf(b.oid);kind[o.type]=kind[o.type]||{n:0,v:0};kind[o.type].n++;kind[o.type].v+=b.total;
    b.pays.forEach(p=>{pay[p[0]]=pay[p[0]]||{n:0,v:0};pay[p[0]].n++;pay[p[0]].v+=p[1]});
    ls(S,b.oid).forEach(l=>{const it=item(S,l.item);byItem[it.name]=byItem[it.name]||{q:0,v:0};byItem[it.name].q+=l.qty;byItem[it.name].v+=l.qty*l.price;byCat[it.cat]=(byCat[it.cat]||0)+l.qty*l.price})});
  return{byDay,byItem,byCat,pay,kind,top:Object.entries(byItem).sort((a,b)=>b[1].q-a[1].q).slice(0,8),low:S.ing.filter(g=>g.qty<=g.min)}}
const tbl=(h,rows,e)=>`<div class="tbl"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.join("")||`<tr><td colspan="${h.length}">${e}</td></tr>`}</table></div>`;
function pRep(){const d=repData(),tm=d.top.length?d.top[0][1].q:1,days=Object.keys(d.byDay).sort().reverse().slice(0,14);
  return `<div class="row" style="justify-content:space-between"><div><h1>Reports</h1><p class="sub" style="margin:0">Module 5 · built from database views</p></div><button onclick="exportCsv()">⬇ Export CSV</button></div>
  <div class="two" style="margin-top:14px"><div class="card"><h2>Daily sales (v_daily_sales)</h2>${tbl(["Date","Bills","Revenue"],days.map(k=>`<tr><td>${k}</td><td>${d.byDay[k].n}</td><td>${money(d.byDay[k].v)}</td></tr>`),"No sales yet")}</div>
  <div class="card"><h2>Top selling items (v_top_items)</h2>${d.top.map(([n,x])=>`<div class="row" style="flex-wrap:nowrap"><span style="width:42%">${esc(n)}</span><div class="barbox"><div class="bar" style="width:${x.q/tm*100}%"></div></div><b>${x.q}</b></div>`).join("")||'<p class="sub">No sales yet</p>'}</div></div>
  <div class="two"><div class="card"><h2>Revenue by category</h2>${tbl(["Category","Revenue"],Object.entries(d.byCat).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`),"No data")}</div>
  <div class="card"><h2>Payments by method (v_payment_summary)</h2>${tbl(["Method","Payments","Amount"],Object.entries(d.pay).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${money(v.v)}</td></tr>`),"No data")}</div></div>
  <div class="two"><div class="card"><h2>Dine-in vs takeaway</h2>${tbl(["Type","Bills","Revenue"],Object.entries(d.kind).map(([k,v])=>`<tr><td>${k==="DINE_IN"?"Dine-in":"Takeaway"}</td><td>${v.n}</td><td>${money(v.v)}</td></tr>`),"No data")}</div>
  <div class="card"><h2>Low stock alerts (v_low_stock)</h2>${tbl(["Ingredient","Stock","Reorder at"],d.low.map(g=>`<tr><td>${esc(g.name)}</td><td class="low">${g.qty} ${esc(g.unit)}</td><td>${g.min}</td></tr>`),"All stock is healthy")}</div></div>`}
function exportCsv(){const d=repData(),q=s=>'"'+String(s).replace(/"/g,'""')+'"',o=[];
  o.push("DAILY SALES","Date,Bills,Revenue");Object.keys(d.byDay).sort().reverse().forEach(k=>o.push([k,d.byDay[k].n,r2(d.byDay[k].v)].join(",")));
  o.push("","TOP ITEMS","Item,Sold,Revenue");d.top.forEach(([n,x])=>o.push([q(n),x.q,r2(x.v)].join(",")));
  o.push("","REVENUE BY CATEGORY","Category,Revenue");Object.entries(d.byCat).forEach(([k,v])=>o.push([q(k),r2(v)].join(",")));
  o.push("","PAYMENTS BY METHOD","Method,Payments,Amount");Object.entries(d.pay).forEach(([k,v])=>o.push([k,v.n,r2(v.v)].join(",")));
  o.push("","LOW STOCK","Ingredient,Stock,Unit,Reorder level");d.low.forEach(g=>o.push([q(g.name),g.qty,g.unit,g.min].join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o.join("\n")],{type:"text/csv"}));a.download="restaurant_report.csv";a.click();toast("Report exported")}

const PAGES={dash:pDash,menu:pMenu,recipe:pRecipe,orders:pOrders,order:pOrder,bill:pBill,inv:pInv,rep:pRep};
load();render();

</script></body></html>
